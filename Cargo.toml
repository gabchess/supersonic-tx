[package]
name = "noisebench"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Longitudinal privacy-claim regression gate for transaction-noise planners"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"

[dev-dependencies]
tempfile = "3.23.0"
